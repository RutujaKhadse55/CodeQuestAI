openapi: 3.0.3
info:
  title: CodeQuest AI
  version: 0.1.0
  description: |
    Contract draft (Backend-owned). FREEZE at T+0:45; after that additive changes only
    (new optional fields), acked by producer and consumer. MOCK=1 serves the examples below.
servers: [{url: "http://localhost:8000"}]
security: [{ApiToken: []}]
components:
  securitySchemes:
    ApiToken: {type: apiKey, in: header, name: X-API-Token, description: "Also accepted: Authorization: Bearer <token> (used by the extension)"}
  schemas:
    ErrorBody:
      type: object
      required: [code]
      properties:
        code: {type: string, enum: [UNAUTHORIZED, FORBIDDEN, VALIDATION_ERROR, RATE_LIMITED, CODE_REJECTED, HINT_LOCKED, UNSUPPORTED_PROBLEM, UNSUPPORTED_LANGUAGE, CREDIT_CAP_REACHED, UPSTREAM_FAILED]}
        message: {type: string, nullable: true}
    Example:
      type: object
      required: [input_text, output_text]
      properties: {input_text: {type: string}, output_text: {type: string}}
    RunCapture:
      type: object
      required: [verdict]
      properties:
        verdict: {type: string}
        input: {type: string, nullable: true}
        output: {type: string, nullable: true}
        expected: {type: string, nullable: true}
        stdout: {type: string, nullable: true}
        error: {type: string, nullable: true}
    LCProblem:
      type: object
      required: [slug, title, difficulty, tags, statement_text, examples, constraints_text, lang_selected, content_hash]
      properties:
        slug: {type: string}
        title: {type: string}
        difficulty: {type: string}
        tags: {type: array, items: {type: string}}
        statement_text: {type: string, maxLength: 8000}
        examples: {type: array, items: {$ref: "#/components/schemas/Example"}}
        constraints_text: {type: string}
        starter_python: {type: string, nullable: true}
        lang_selected: {type: string}
        content_hash: {type: string}
        run_capture: {allOf: [{$ref: "#/components/schemas/RunCapture"}], nullable: true}
    TestResult:
      type: object
      required: [kind, outcome]
      description: For kind=fuzz, input/expected/actual are ALWAYS null (hidden data is never shown).
      properties:
        kind: {type: string, enum: [example, run_capture, fuzz]}
        outcome: {type: string, enum: [passed, wrong_output, runtime_error, timeout]}
        input: {type: string, nullable: true}
        expected: {type: string, nullable: true}
        actual: {type: string, nullable: true}
        failure_class: {type: string, nullable: true}
        error: {type: string, nullable: true, description: "additive (Phase 1): runtime error / timeout text"}
    Divergence:
      type: object
      properties:
        iteration: {type: integer, nullable: true}
        variable: {type: string, nullable: true}
        expected: {}
        actual: {}
        line: {type: integer, nullable: true}
    Diagnosis:
      type: object
      properties:
        mistake_class: {type: string, nullable: true}
        confidence: {type: number}
        failure_class: {type: string, nullable: true}
        divergence: {allOf: [{$ref: "#/components/schemas/Divergence"}], nullable: true}
    AnalyzeRequest:
      type: object
      required: [problem_slug, code]
      description: "Aliases accepted: slug -> problem_slug, lang -> language. user_id defaults to local-user."
      properties:
        user_id: {type: string, default: local-user}
        problem_slug: {type: string}
        lang_pref: {type: string, nullable: true}
        code: {type: string}
        language: {type: string, default: python3}
        run_capture: {allOf: [{$ref: "#/components/schemas/RunCapture"}], nullable: true}
        paste_chars: {type: integer, default: 0}
        elapsed_ms: {type: integer, default: 0}
    AnalyzeResponse:
      type: object
      required: [attempt_id, verified, results]
      properties:
        attempt_id: {type: integer}
        verified: {type: string, enum: [oracle-verified, unverified]}
        results: {type: array, items: {$ref: "#/components/schemas/TestResult"}}
        diagnosis: {allOf: [{$ref: "#/components/schemas/Diagnosis"}], nullable: true}
        explanation: {type: string, nullable: true}
        flags: {type: array, items: {type: string}, description: "e.g. copy_suspected, no_reference_bundle, fuzz_budget_hit"}
        allowed_hint_level: {type: integer, nullable: true, description: "additive (Phase 2): highest unlocked hint tier"}
    HintResult:
      type: object
      required: [level, text]
      properties:
        level: {type: integer, minimum: 1, maximum: 4}
        text: {type: string}
        locked: {type: boolean}
        requirements: {type: string, nullable: true}
        guard: {type: object, properties: {passed: {type: boolean}, retries: {type: integer}, source: {type: string, enum: [llm, template]}}}
paths:
  /health:
    get:
      summary: Liveness check (token required)
      responses:
        "200": {description: ok, content: {application/json: {example: {status: ok, version: 0.1.0}}}}
        "401": {description: UNAUTHORIZED, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorBody"}}}}
  /users:
    post:
      summary: Create an anonymous learner
      responses:
        "200": {description: ok, content: {application/json: {example: {user_id: mock-user-1}}}}
  /problems/capture:
    post:
      summary: Store a captured LeetCode problem (idempotent by content_hash)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LCProblem"}}}}
      responses:
        "200":
          description: "supported=false => explanation-only; reason is UNSUPPORTED_LANGUAGE or 'UNSUPPORTED_TYPE: ...'"
          content: {application/json: {example: {problem_id: two-sum, supported: true, reason: null}}}
  /analyze:
    post:
      summary: Run the verification + diagnosis pipeline
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AnalyzeRequest"}}}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnalyzeResponse"}
              example:
                attempt_id: 1
                verified: oracle-verified
                results:
                  - {kind: example, outcome: passed, input: "nums = [2,7,11,15], target = 9", expected: "[0,1]", actual: "[0,1]"}
                  - {kind: fuzz, outcome: wrong_output, failure_class: single_element}
                diagnosis:
                  mistake_class: missing_edge_single
                  confidence: 0.86
                  failure_class: single_element
                  divergence: {iteration: 2, variable: seen, expected: {"2": 0}, actual: {}, line: 7}
                explanation: Your loop skips the case where the list has a single element.
                flags: []
        "400": {description: CODE_REJECTED, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorBody"}}}}
  /admin/attacks:
    get:
      summary: Run the sandbox attack set (evidence); every entry must be blocked
      responses:
        "200": {description: ok, content: {application/json: {example: {total: 8, blocked: 8, results: [{name: file_read, blocked: true, by: policy, detail: banned_builtin}]}}}}
  /hint:
    post:
      summary: Next allowed hint (AI-owned; level enforced by Backend HintState)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HintResult"}
              example: {level: 1, text: "Think about what you need to remember while scanning the list.", locked: false, guard: {passed: true, retries: 0, source: template}}
        "423": {description: HINT_LOCKED, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorBody"}}}}
  /hint-state/{user_id}/{problem_slug}:
    get:
      summary: Which hint tier is unlocked (attempts / elapsed time; copy-flagged attempts excluded)
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string}}
        - {name: problem_slug, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {example: {allowed_level: 2, max_level_given: 1, attempts_counted: 2, elapsed_s: 95, next_requirement: "Unlocks after 3 attempts or 6 minutes on this problem"}}}}
  /attempts/{user_id}:
    get:
      summary: Recent attempts (no code, no fuzz seed)
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {example: [{attempt_id: 7, problem_slug: binary-search, passed_all: false, verified: oracle-verified, copy_flagged: false, created_at: "2026-10-11T08:12:57+00:00"}]}}}
  /dashboard/{user_id}:
    get:
      summary: Mastery, mistakes, recent diagnoses
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: ok
          content: {application/json: {example: {user_id: mock-user-1, mastery: {arrays: 1210}, mistakes: {missing_edge_single: 2}, recent: [], verified: {oracle-verified: 1, unverified: 0}}}}
  /recommend/{user_id}:
    get:
      summary: Next curated LeetCode problem by weakest concept
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {example: {slug: binary-search, title: Binary Search, reason: "weakest concept: boundaries"}}}}
  /tts:
    post:
      summary: Text to speech (Agents-owned; mock returns browser fallback)
      responses:
        "200": {description: audio or fallback signal, content: {application/json: {example: {fallback: browser_tts}}}}
